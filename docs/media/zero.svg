<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">0 ads, 0 subscriptions, 0 trackers, 100% open source</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4" spreadMethod="reflect">
      <stop offset="0" stop-color="#4a23c9"/>
      <stop offset="0.5" stop-color="#9b35e0"/>
      <stop offset="1" stop-color="#e2409c"/>
      <!-- reflect repeats every 2 widths, so this loops without a jump -->
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 2 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="1200" height="300" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle cx="160" cy="40" r="120" fill="#3fa0ff" opacity="0.45" filter="url(#blur)">
      <animate attributeName="cx" values="160;320;160" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="280" r="140" fill="#ff8a5c" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="1040;860;1040" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif" fill="#fff" text-anchor="middle">
    <g fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5">
      <rect x="60" y="60" width="240" height="180" rx="28"/>
      <rect x="340" y="60" width="240" height="180" rx="28"/>
      <rect x="620" y="60" width="240" height="180" rx="28"/>
      <rect x="900" y="60" width="240" height="180" rx="28"/>
    </g>
    <g font-size="88" font-weight="800">
      <text x="180" y="165">0</text>
      <text x="460" y="165">0</text>
      <text x="740" y="165">0</text>
      <text x="1020" y="160" font-size="72">100%</text>
    </g>
    <g font-size="25" font-weight="600" fill-opacity="0.92">
      <text x="180" y="210">ads</text>
      <text x="460" y="210">subscriptions</text>
      <text x="740" y="210">trackers</text>
      <text x="1020" y="210">open source</text>
    </g>
  </g>
  <path d="M1150 34 q3 17 20 20 q-17 3 -20 20 q-3 -17 -20 -20 q17 -3 20 -20z" fill="#fff4c2">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
