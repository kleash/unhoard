name: Tidyroll
options:
  bundleIdPrefix: com.kleash
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Tidyroll:
    type: application
    platform: iOS
    sources: [Tidyroll]
    info:
      path: Tidyroll/Info.plist # merged with the generated keys below
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).scan.*
          - $(PRODUCT_BUNDLE_IDENTIFIER).scan-overnight
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.tidyroll
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tidyroll
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Tidyroll looks through your photo library on this iPhone to find screenshots, similar and blurry shots, large videos and accidental clips, and deletes only the items you choose. Nothing leaves your iPhone unless you ask Claude for a second opinion.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Tidyroll saves the still photos you make from short clips to your photo library.
  TidyrollTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TidyrollTests]
    dependencies:
      - target: Tidyroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.tidyroll.tests
  TidyrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TidyrollUITests]
    dependencies:
      - target: Tidyroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.tidyroll.uitests
        TEST_TARGET_NAME: Tidyroll
schemes:
  Tidyroll:
    build:
      targets:
        Tidyroll: all
        TidyrollTests: [test]
    test:
      targets: [TidyrollTests]
  TidyrollUI:
    build:
      targets:
        Tidyroll: all
        TidyrollUITests: [test]
    test:
      targets: [TidyrollUITests]
