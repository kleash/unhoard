name: Unhoard
options:
  bundleIdPrefix: com.kleash
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Unhoard:
    type: application
    platform: iOS
    sources: [Unhoard]
    info:
      path: Unhoard/Info.plist # merged with the generated keys below
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).scan.*
          - $(PRODUCT_BUNDLE_IDENTIFIER).scan-overnight
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.unhoard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Unhoard
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Unhoard looks through your photo library on this iPhone to find screenshots, similar and blurry shots, large videos and accidental clips, and deletes only the items you choose.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Unhoard saves the still photos you make from short clips to your photo library.
  UnhoardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnhoardTests]
    dependencies:
      - target: Unhoard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.unhoard.tests
  UnhoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UnhoardUITests]
    dependencies:
      - target: Unhoard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kleash.unhoard.uitests
        TEST_TARGET_NAME: Unhoard
schemes:
  Unhoard:
    build:
      targets:
        Unhoard: all
        UnhoardTests: [test]
    test:
      targets: [UnhoardTests]
  UnhoardUI:
    build:
      targets:
        Unhoard: all
        UnhoardUITests: [test]
    test:
      targets: [UnhoardUITests]
